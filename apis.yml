name: Hearth
description: Hearth is a business-management platform for residential home-improvement
  contractors and trades professionals. It bundles customer financing (a marketplace
  of 18+ lenders with $0 dealer fees), quotes and estimates, digital contracts and
  e-signature, invoicing and payments, client management, and scheduling, together
  with Harper, a 24/7 AI receptionist that answers calls, handles follow-ups, and
  creates social content. Hearth serves 16+ residential contracting verticals including
  roofing, HVAC, plumbing, landscaping, fencing, and flooring, and is backed by 8vc.
